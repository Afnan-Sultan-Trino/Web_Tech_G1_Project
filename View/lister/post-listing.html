<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Your Room - CampusNest</title>

    <link rel="stylesheet" href="../assets/styles.css">

</head>

<body>


<header class="nest-topbar">

    <a href="../index.html" class="nest-brand">
        CampusNest
    </a>

    <span class="nest-role-pill gold">
        Lister
    </span>

</header>


<main class="nest-page">

    <div class="nest-shell">

        <p class="nest-eyebrow">
            Lister
        </p>

        <h1 class="nest-heading">
            Post Your <em>Room</em>
        </h1>

        <p class="nest-sub">
            Add your property details so students can find it.
        </p>


        <div class="nest-card">

            <form
                    action="../../Controller/post-listing.php"
                    method="POST"
                    enctype="multipart/form-data"
                    novalidate>


                <div class="nest-field">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter property location"
                        name="location"
                        required>

                </div>


                <fieldset>

                    <legend>
                        Room Details
                    </legend>


                    <div class="nest-chip-group">

                        <div class="nest-chip">

                            <input
                                type="radio"
                                name="room"
                                id="single"
                                value="single">

                            <label for="single">
                                Single
                            </label>

                        </div>


                        <div class="nest-chip">

                            <input
                                type="radio"
                                name="room"
                                id="master"
                                value="master">

                            <label for="master">
                                Master
                            </label>

                        </div>


                        <div class="nest-chip">

                            <input
                                type="radio"
                                name="room"
                                id="partition"
                                value="partition">

                            <label for="partition">
                                Partition
                            </label>

                        </div>

                    </div>

                </fieldset>


                <fieldset>

                    <legend>
                        Property Type
                    </legend>


                    <div class="nest-chip-group">

                        <div class="nest-chip">

                            <input
                                type="checkbox"
                                id="furnished">

                            <label for="furnished">
                                Furnished
                            </label>

                        </div>


                        <div class="nest-chip">

                            <input
                                type="checkbox"
                                id="not-furnished">

                            <label for="not-furnished">
                                Not Furnished
                            </label>

                        </div>


                        <div class="nest-chip">

                            <input
                                type="checkbox"
                                id="bachelor">

                            <label for="bachelor">
                                Bachelor
                            </label>

                        </div>


                        <div class="nest-chip">

                            <input
                                type="checkbox"
                                id="family">

                            <label for="family">
                                Family
                            </label>

                        </div>


                        <div class="nest-chip">

                            <input
                                type="checkbox"
                                id="job-holder">

                            <label for="job-holder">
                                Job Holder
                            </label>

                        </div>

                    </div>

                </fieldset>


                <div class="nest-field">

                    <label for="image">
                        Room Image
                    </label>

                    <div class="upload-box">

                        <input
                            type="file"
                            id="image"
                            name="image"
                            accept="image/*">

                    </div>

                </div>


                <div class="nest-field">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your room or property"></textarea>

                </div>


                <div class="nest-row">

                    <div class="nest-field">

                        <label for="price">
                            Price
                        </label>

                        <input
                            type="number"
                            id="price"
                            name="price"
                            placeholder="Monthly rent">

                    </div>


                    <div class="nest-field">

                        <label for="contact">
                            Contact
                        </label>

                        <input
                            type="tel"
                            id="contact"
                            name="contact"
                            placeholder="01XXXXXXXXX">

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">
                    Post Listing
                </button>


            </form>

        </div>

    </div>

</main>

<script src="../assets/validation.js"></script>
</body>
</html>
