<!DOCTYPE html>
<head>
    <title>Forgot Password - CampusNest</title>

    <link rel="stylesheet" href="../assets/styles.css">

</head>

<body>


<header class="nest-topbar">

    <a href="../index.html" class="nest-brand">
        CampusNest
    </a>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h1 class="auth-title">
            Reset Password
        </h1>

        <p class="nest-sub">
            Enter your email address to reset your password.
        </p>


        <form>

            <div class="nest-field">

                <label for="email">
                    Email
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="Enter your email"
                    >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%;">
                Send Reset Link
            </button>

        </form>


        <p class="auth-link">

            <a href="login.html">
                Back to Login
            </a>

        </p>

    </div>

</main>

<script src="../assets/validation.js"></script>
</body>
</html>
